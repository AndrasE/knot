<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Join Sarah and Andras as they tie the knot! RSVP to their wedding and find all the details you need to celebrate with them." />
  <link rel="icon" href="/favicon.ico">

  <title>knot</title>

  <style>
    /* Custom font faces */
    @font-face {
      font-family: "Dawning";
      src: url("src/assets/fonts/Dawning.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Roboto";
      src: url("src/assets/fonts/RobotoExtraLight.ttf") format("truetype");
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }

    /* Global styles */
    :root {
      line-height: 1.5;
      font-weight: 400;
      color: rgba(0, 0, 0, 0.87);
      background-color: #f5f0e6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: "Roboto", Arial, sans-serif;
      font-weight: 100;
    }

    /* Utility class for Dawning font */
    .font-dawning {
      font-family: "Dawning", serif;
    }
  </style>

  <link rel="preload" href="/assets/fonts/RobotoExtraLight.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/assets/fonts/Dawning.ttf" as="font" type="font/ttf" crossorigin>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
